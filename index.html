<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Cadastro de Objetos Tecnológicos</title>
</head>
<body>
    <h1>&gt; Cadastro de Objetos Tech</h1>

    <form id="formObjeto">
        <input type="text" id="nome" placeholder="Nome do objeto" required>
        <input type="text" id="tipo" placeholder="Tipo (ex: Periférico, Celular...)" required>
        <button id="btnSalvar" type="submit">Cadastrar</button>
    </form>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Objeto</th>
                <th>Tipo</th>
            </tr>
        </thead>

        <tbody id="corpoTabela"></tbody>
    </table>

    <script src="main.js"></script>
</body>
</html>
